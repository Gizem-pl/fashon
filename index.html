<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Fashon</title>
  <meta name="description" content="A private creative director for your wardrobe.">
  <meta name="theme-color" content="#131316">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fashon">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div class="brand">Fashon</div>
    <main id="views">
      <section id="view-studio" class="view" aria-label="Creative Director" hidden></section>
      <section id="view-closet" class="view" aria-label="Closet and Vanity" hidden></section>
      <section id="view-checker" class="view" aria-label="Fit and Style Link Checker" hidden></section>
      <section id="view-profile" class="view" aria-label="My Profile and Proportions" hidden></section>
    </main>

    <nav id="tabbar" aria-label="Main">
      <button class="tab" data-tab="studio" aria-label="Creative Director">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l1.9 4.6 4.9.4-3.7 3.2 1.1 4.8L12 13.7 7.8 16.2l1.1-4.8L5.2 8.2l4.9-.4z"/><path d="M5 20.5h14"/></svg>
        <span>Studio</span>
      </button>
      <button class="tab" data-tab="closet" aria-label="Closet and Vanity">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5a2 2 0 1 0-2-2"/><path d="M12 6.5v2l8.2 5.6a1.2 1.2 0 0 1-.7 2.2H4.5a1.2 1.2 0 0 1-.7-2.2L12 8.5"/></svg>
        <span>Closet</span>
      </button>
      <button class="tab" data-tab="checker" aria-label="Fit and Style Link Checker">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
        <span>Checker</span>
      </button>
      <button class="tab" data-tab="profile" aria-label="My Profile and Proportions">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.8 20c.6-3.6 3.5-5.6 7.2-5.6s6.6 2 7.2 5.6"/></svg>
        <span>Profile</span>
      </button>
    </nav>
  </div>

  <div id="sheet-root" aria-live="polite"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:24px;font-family:serif">Fashon needs JavaScript to run.</p></noscript>
  <script type="module" src="ui.js"></script>
</body>
</html>
